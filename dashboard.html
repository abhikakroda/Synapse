<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Batch | Synapse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Synapse home"><span>Synapse</span></a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html#programs">Platform</a>
        <a href="workshops.html">Workshops</a>
        <a href="course.html">Course</a>
        <a class="nav-cta" href="#" id="logoutBtn">Logout</a>
      </nav>
    </header>

    <main>
      <section class="section-pad dashboard-hero">
        <div class="section-heading" style="text-align:left;max-width:100%">
          <p class="section-label">My Batch</p>
          <h1 id="dashGreeting">Welcome back</h1>
          <p>Your purchased courses and internship batches appear here.</p>
        </div>

        <div class="dashboard-grid" id="dashGrid">
          <div class="dash-empty">
            <p>No courses purchased yet.</p>
            <a class="btn btn-primary" href="course.html">Browse Courses</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <a class="brand" href="index.html"><span>Synapse</span></a>
        <p>Internship + career acceleration for ambitious students.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#programs">Courses</a>
        <a href="workshops.html">Workshops</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </footer>

    <a class="whatsapp-float" href="https://wa.me/918803250878" target="_blank" aria-label="Chat on WhatsApp">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </a>

    <script>
      // Menu toggle
      const menuButton = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".nav");
      menuButton?.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("open");
        document.body.classList.toggle("menu-open", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });

      // Auth check
      const user = JSON.parse(localStorage.getItem("synapse_user") || "null");
      if (!user) {
        window.location.href = "index.html";
      } else {
        document.getElementById("dashGreeting").textContent = `Welcome, ${user.name}`;
      }

      // Show purchased batches
      const purchases = JSON.parse(localStorage.getItem("synapse_purchases") || "[]");
      if (purchases.length) {
        const grid = document.getElementById("dashGrid");
        grid.innerHTML = purchases.map(p => `
          <article class="dash-course-card">
            <div class="dash-course-icon">${p.title.slice(0, 2)}</div>
            <div>
              <h3>${p.title}</h3>
              <p>Purchased on ${p.date}</p>
              <span class="course-status-badge is-live">Active</span>
            </div>
          </article>
        `).join("");
      }

      // Logout
      document.getElementById("logoutBtn").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("synapse_user");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
