<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#111827" />
    <title>Certificate Verification | Synapse</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Synapse home"><span>Synapse</span></a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html#top">Home</a>
        <a href="workshops.html">Workshops</a>
        <a href="course.html">Course</a>
        <a href="verify.html">Verify</a>
        <a class="nav-cta" href="index.html#contact">Contact Us</a>
      </nav>
    </header>

    <main>
      <section class="section-pad verify-hero">
        <div class="section-heading">
          <p class="section-label">Verify</p>
          <h1>Certificate Verification</h1>
          <p>Enter a certificate ID to verify its authenticity. Colleges and recruiters can confirm internship completion here.</p>
        </div>

        <div class="verify-form-card">
          <form id="verifyForm">
            <label>
              Certificate ID
              <input type="text" id="certId" placeholder="e.g. SYN-2026-001" required />
            </label>
            <button class="btn btn-primary" type="submit">Verify Certificate</button>
          </form>
          <div id="verifyResult" class="verify-result"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <a class="brand" href="index.html"><span>Synapse</span></a>
        <p>Internship + career acceleration for ambitious students.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#programs">Courses</a>
        <a href="workshops.html">Workshops</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </footer>

    <a class="whatsapp-float" href="https://wa.me/918803250878?text=Hi%20Synapse%2C%20I%20want%20to%20verify%20my%20certificate" target="_blank" aria-label="Chat on WhatsApp">

    </a>

    <script>
      // Menu toggle
      const menuButton = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".nav");
      menuButton?.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("open");
        document.body.classList.toggle("menu-open", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
      });
      nav?.addEventListener("click", (e) => {
        if (e.target instanceof HTMLAnchorElement) {
          nav.classList.remove("open");
          document.body.classList.remove("menu-open");
          menuButton?.setAttribute("aria-expanded", "false");
        }
      });

      // Sample certificate database (fallback)
      const certificates = {
        "SYN-2026-001": { name: "Sample Student", domain: "AI & Machine Learning", project: "AI-Powered Resume Analyzer", date: "August 2026", status: "Verified" },
        "SYN-2026-002": { name: "Demo User", domain: "Cybersecurity", project: "Network Vulnerability Scanner", date: "August 2026", status: "Verified" }
      };

      document.getElementById("verifyForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("certId").value.trim().toUpperCase();
        const result = document.getElementById("verifyResult");

        // Try Supabase first
        let cert = null;
        try {
          cert = await verifyCertificate(id);
        } catch (err) {}

        // Fallback to local
        if (!cert) cert = certificates[id];

        if (cert) {
          result.innerHTML = `
            <div class="verify-success">
              <div class="verify-badge">✓ Verified</div>
              <h3>${cert.name}</h3>
              <dl>
                <dt>Certificate ID</dt><dd>${id}</dd>
                <dt>Domain</dt><dd>${cert.domain}</dd>
                <dt>Project</dt><dd>${cert.project}</dd>
                <dt>Completion</dt><dd>${cert.date}</dd>
                <dt>Status</dt><dd>${cert.status || "Verified"}</dd>
              </dl>
            </div>`;
        } else {
          result.innerHTML = `<div class="verify-error"><strong>Certificate not found.</strong><p>Please check the ID and try again. Contact us on WhatsApp if you need help.</p></div>`;
        }
      });

      // Read URL param
      const urlId = new URLSearchParams(window.location.search).get("id");
      if (urlId) {
        document.getElementById("certId").value = urlId;
        document.getElementById("verifyForm").dispatchEvent(new Event("submit"));
      }
    </script>
  </body>
</html>
